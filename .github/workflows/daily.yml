name: Pipeline diario
on:
  schedule:
    - cron: "30 12 * * *"   # 07:30 en Bogotá (UTC-5)
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: daily-pipeline, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Despertar la API (Render free)
        run: curl -s -m 120 https://napa-api.onrender.com/api/health || true
      - name: Ingesta (raw append-only)
        run: python -m ingest.napa_ingest
      - name: dbt build
        working-directory: transform
        run: mkdir -p ../warehouse && dbt build --profiles-dir .
      - name: Exportar datos del tablero
        run: python -m ingest.export_dashboard
      - name: Publicar (commit de datos)
        run: |
          git config user.name "napa-pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "data: snapshot $(TZ=America/Bogota date +%F)"
          git push
